<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compare Hospitals | Hospital Nama</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <style>
        body, html { 
            height: 100%; 
            margin: 0; 
            background-color: #ffffff; 
            font-family: "Noto Sans";
            color: #000;
        }
        .brutal-border {
            border: 2px solid #000;
            border-radius: 5px;
            background-color: #fff;
        }
        .brutal-btn {
            background-color: #fff;
            color: #000;
            border: 2px solid #000;
            border-radius: 0px;
            font-weight: bold;
            transition: all 0.1s ease-in-out;
        }
        .brutal-btn:hover {
            opacity: 0.9;
            transform: translate(3px, 3px);
        }
        .table-brutal {
            border: 2px solid #000;
        }
        .table-brutal th, .table-brutal td {
            border: 1px solid #000;
            padding: 12px;
            vertical-align: middle;
        }
        /* Custom header override to force pitch black background */
        .table-brutal thead.table-dark th { 
            background-color: #000 !important; 
            color: #fff !important;
            border-bottom: 2px solid #000;
        }

        .category-header {
            background-color: #000000 !important; /* Premium light gray background */
            color: #000 !important;               /* Sharp black text */
            cursor: pointer;
            user-select: none;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-top: 2px solid #000 !important;   /* Thicker top border for brutalist style */
            border-bottom: 2px solid #000 !important;/* Thicker bottom border */
        }
        .category-header:hover {
            background-color: #dee2e6 !important; /* Slightly darker gray when hovering */
        }

        .toggle-icon {
            display: inline-block;
            transition: transform 0.2s;
            margin-right: 8px;
        }
        .collapsed .toggle-icon {
            transform: rotate(-90deg);
        }
    </style>
</head>
<body class="d-flex flex-column h-100">

<nav class="navbar navbar-expand-lg px-4 py-3 " style="background-color:#003049;" >
    <span class="navbar-brand mb-0 fw-bold fs-8 text-white" style="cursor:pointer;" href="/" >Hospital Nama | ہسپتال نامہ</span>
    <div class="ms-auto">
        <ul class="navbar-nav flex-row gap-4 ">
            <li class="nav-item "><a class="nav-link" style="color:white !important;" href="/">Home</a></li>
            <li class="nav-item"><a class="nav-link" style="color:white !important;" href="/about">About Us</a></li>
        </ul>
    </div>
</nav>

<div class="container mt-5 flex-grow-1">
    <div class="d-flex align-items-center gap-4 mb-4">
        <a href="{{ url_for('map_view') }}" class="btn brutal-btn" style="background-color:#780000; color:white !important;">← Back to Main Map</a>
        <h2 class="fw-bold mb-0">Hospital Comparison</h2>
    </div>

    <div class="brutal-border p-0 overflow-auto mb-5">
        <table class="table table-brutal mb-0" id="compare-table">
            <thead id="compare-thead" class="table-dark text-white">
            </thead>
            <tbody id="compare-tbody">
            </tbody>
        </table>
    </div>
</div>

<footer class="py-3 mt-auto" style="background-color:#003049; color:white; border-top: 2px solid #000;">
    <div class="container text-center">
        <span class="fw-bold small">Hospital Nama | 2026</span>
    </div>
</footer>

<script>
document.addEventListener("DOMContentLoaded", () => {
    const compareList = JSON.parse(localStorage.getItem('compareList')) || [];
    
    if (compareList.length < 2) {
        document.getElementById('compare-table').innerHTML = `
            <div class="p-5 text-center">
                <h4>Not enough hospitals selected.</h4>
                <p>Please go back to the map and select at least 2 hospitals to compare.</p>
                <a href="{{ url_for('map_view') }}" class="btn brutal-btn mt-3" style="background-color:#780000; color:white !important;">Go to Map</a>
            </div>
        `;
        return;
    }

    const tHead = document.getElementById('compare-thead');
    const tBody = document.getElementById('compare-tbody');
    const columnCount = compareList.length + 1;

    // Build Table Headers
    let headerHtml = `<tr><th style="width: 25%;">Metric</th>`;
    compareList.forEach(h => {
        headerHtml += `<th>${h["Hospital Name"] || 'Unnamed Hospital'}</th>`;
    });
    headerHtml += `</tr>`;
    tHead.innerHTML = headerHtml;

    // Categorized Configuration Array
    // Structure: sectionId, sectionTitle, isCollapsedByDefault, metricsArray[ [Label, DataKey, Suffix] ]
    const sections = [
        {
            id: "general-stats",
            title: "General Statistics",
            collapsed: false,
            metrics: [
                ["Sector", "Sector", ""],
                ["Teaching Hospital", "Teaching Hospital ", ""],
                ["Beds", "Beds", ""],
                ["Marham Price", "Marham Price", ""],
                ["Departments", "Departments", ""],
                ["OPD", "OPD", ""],
                ["Emergency", "Emergency", ""],
                ["Blood Bank", "Blood Bank", ""]
            ]
        },
        {
            id: "regulatory-stats",
            title: "Regulatory Statistics",
            collapsed: false,
            metrics: [
                ["PHC Zone", "PHC Zone", ""],
                ["Sehat-Card Empaneled", "Sehat-Card Empaneled", ""],
                ["SCE For What", "SCE For What", "", true] // Special flag for Sehat Card conditional logic
            ]
        },
        {
            id: "review-stats",
            title: "Review Statistics",
            collapsed: false,
            metrics: [
                ["Total Reviews (All Stars)", "Total Reviews (All Stars)", ""],
                ["Negative Reviews Count (1-3 Stars)", "Negative Reviews Count (1-3 Stars)", ""],
                ["Negative Reviews Ratio", "Negative Reviews Ratio (%)", "%"]
            ]
        },
        {
            id: "major-themes",
            title: "Major Themes",
            collapsed: false,
            metrics: [
                ["Environment", "Major Theme: enviornment (%)", "%"],
                ["Behaviour", "Major Theme: behaviour (%)", "%"],
                ["Money", "Major Theme: money (%)", "%"],
                ["Time", "Major Theme: time (%)", "%"],
                ["Management", "Major Theme: management (%)", "%"],
                ["Process Specific", "Major Theme: process specific (%)", "%"]
            ]
        },
        {
            id: "sub-themes",
            title: "Process Specific Themes",
            collapsed: true, // Closed by default as requested!
            metrics: [
                ["Nephrology", "Sub-Theme: nephrology (%)", "%"],
                ["Pharmacy", "Sub-Theme: pharmacy (%)", "%"],
                ["Gynaecology", "Sub-Theme: gynaecology (%)", "%"],
                ["Tests", "Sub-Theme: tests (%)", "%"],
                ["Gastro", "Sub-Theme: gastro (%)", "%"],
                ["Cardiology", "Sub-Theme: cardiology (%)", "%"],
                ["Orthopedics", "Sub-Theme: orthopedics (%)", "%"],
                ["Emergency", "Sub-Theme: emergancy (%)", "%"],
                ["Diagnosis", "Sub-Theme: diagnosis (%)", "%"],
                ["Urology", "Sub-Theme: urology (%)", "%"],
                ["Dentistry", "Sub-Theme: dentistry (%)", "%"],
                ["Blood", "Sub-Theme: blood (%)", "%"],
                ["Cancer", "Sub-Theme: cancer (%)", "%"],
                ["Vaccines", "Sub-Theme: vaccines (%)", "%"],
                ["Radiology", "Sub-Theme: radiology (%)", "%"],
                ["ICU", "Sub-Theme: icu (%)", "%"],
                ["Derma", "Sub-Theme: derma (%)", "%"]
            ]
        }
    ];

    // Render sections and rows dynamically
    sections.forEach(section => {
        // Create the drop-down header row
        const headerRow = document.createElement('tr');
        headerRow.className = `category-header ${section.collapsed ? 'collapsed' : ''}`;
        headerRow.dataset.target = section.id;
        headerRow.innerHTML = `
                    <td colspan="${columnCount}" style="background-color: #e9ecef !important; color: #000 !important; font-weight: 800;">
                        <span class="toggle-icon">▼</span> ${section.title}
                    </td>
                `;        
        tBody.appendChild(headerRow);

        // Render data rows within this category group
        section.metrics.forEach(m => {
            const row = document.createElement('tr');
            row.className = `${section.id}-row`;
            if (section.collapsed) {
                row.style.display = 'none'; // Hide if section is closed by default
            }

            let rowHtml = `<td class="fw-bold style="padding-left: 25px;">${m[0]}</td>`;
            
            compareList.forEach(h => {
                let value = h[m[1]];
                
                // Conditional handling for "SCE For What" row based on "Sehat-Card Empaneled" status
                if (m[3] === true) { 
                    const isEmpaneled = h["Sehat-Card Empaneled"] === "Yes";
                    value = isEmpaneled ? (h["SCE For What"] || "Not specified") : "-";
                } else {
                    value = (value !== undefined && value !== null && value !== '') ? `${value}${m[2]}` : 'N/A';
                }
                
                rowHtml += `<td>${value}</td>`;
            });

            row.innerHTML = rowHtml;
            tBody.appendChild(row);
        });
    });

    // Delegate click events to headers for collapse/expand functionality
    tBody.addEventListener('click', (e) => {
        const header = e.target.closest('.category-header');
        if (!header) return;

        header.classList.toggle('collapsed');
        const targetClass = `.${header.dataset.target}-row`;
        const rows = tBody.querySelectorAll(targetClass);
        const isCollapsed = header.classList.contains('collapsed');

        rows.forEach(row => {
            row.style.display = isCollapsed ? 'none' : '';
        });
    });
});
</script>

</body>
</html>
