<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Map | Hospital Nama | ہسپتال نامہ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Noto+Nastaliq+Urdu:wght@400..700&family=Noto+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=search" />

    <style>
        body, html { 
            height: 100%; 
            margin: 0; 
            background-color: #ffffff; 
            font-family: "Noto Sans";
            color: #000;
        }
        
        .brutal-border {
            border: 2px solid #000;
            border-radius: 5px !important; /* Sharp edges */
            background-color: #fff;
        }

        .brutal-input {
            border: 2px solid #000;
            border-radius: 5px;
            padding: 10px;
        }
        .brutal-input:focus {
            outline: none;
            border-color: #000;
        }

        .brutal-btn {
            background-color: #fff;
            color: #000;
            border: 2px solid #000;
            border-radius: 0px;
            font-weight: bold;
            transition: all 0.1s ease-in-out;
        }
        .brutal-btn:hover {
            background-color: #000;
            color: #fff;
            transform: translate(3px, 3px);
        }

        .navbar { border-bottom: 2px solid #000; }
        .nav-link { color: #000 !important; font-weight: 500; cursor: pointer; }
        .nav-link:hover { text-decoration: underline; }

        /* Scrollbar styling for the sidebar */
        .scrollable-sidebar {
            height: calc(100vh - 120px);
            overflow-y: auto;
            padding-right: 10px;
        }

        /* Map fixes */
        #map { height: calc(100vh - 120px); width: 100%; }

        footer { border-top: 2px solid #000; }

        .hero-bg {
        /* This ensures the image covers the entire section nicely */
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        
        /* Optional: gives the background corners a smooth finish matching bootstrap styles */
        border-radius: 8px; 
        max-width: 1400px; 
        width: 100%;
        margin: 0 auto;
        }
                                                                      
    </style>
</head>
<body class="d-flex flex-column h-100">
    

<nav class="navbar navbar-expand-lg px-4 py-3 " style = "background-color:#003049;" >
    <span class="navbar-brand mb-0 fw-bold fs-8 text-white" style="cursor:pointer;" href="/" >Hospital Nama | ہسپتال نامہ</span>
    <div class="ms-auto">
        <ul class="navbar-nav flex-row gap-4 ">
            <li class="nav-item "><a class="nav-link" style="color:white !important;" href="/">Home</a></li>
            <li class="nav-item"><a class="nav-link" style="color:white !important;" href="/about">About Us</a></li>
        </ul>
    </div>
</nav>


        <div id="map-view" class="container-fluid mt-3 view-section">
        <div class="row px-2">
            
            <div class="col-lg-8 mb-3">
                <div class="brutal-border p-1 h-100">
                    <div id="map"></div>
                </div>
            </div>

            <div class="col-lg-4 scrollable-sidebar">
                
                <div class="brutal-border p-3 mb-4">
                    <h5 class="fw-bold border-dark pb-2 mb-3">Location & Distance</h5>
                    <div class="mb-3">
                        <label class="form-label small fw-bold">Edit Location</label>
                        <input type="text" id="sidebar-location-search" class="form-control brutal-input form-control-sm" placeholder="Search Lahore locations...">
                    </div>
                    <div class="mb-3">
                        <label class="form-label small fw-bold d-flex justify-content-between">
                            <span>Search Radius</span>
                            <strong id="radius-val">10 km</strong>
                        </label>
                        <input type="range" class="form-range" id="radius-slider" min="1" max="30" value="10">
                    </div>
                    <button class="btn brutal-btn w-100" id="btn-get-recs">Get Recommendations</button>
                </div>
                
                <div class="brutal-border p-3 mb-4">
                    <h5 class="fw-bold border-dark pb-2 mb-3">Compare Hospitals</h5>
                    <p class="small text-muted mb-2">Select up to 3 hospitals to compare.</p>
                    <div id="selected-compare-list" class="mb-3 d-flex flex-column gap-2">
                        </div>
                    <button class="btn brutal-btn w-100 d-none" id="btn-go-compare" onclick="window.location.href='/compare'">Go to Compare</button>
                </div>

                <div class="brutal-border p-3 mb-4">
                    <h5 class="fw-bold border-dark pb-2 mb-3">Nearest Hospitals</h5>
                    <div class="list-group list-group-flush" id="ranking-list">
                        </div>
                </div>

                
            </div>
        </div>
    </div>


<footer class=" py-3 mt-auto" id="home-footer" style="background-color:#003049; color:white;">
    <div class="container text-center">
        <span class="fw-bold small"> Hospital Nama | 2026 </span>
        <p class = "small"> Any data on this website is provided solely for informational purposes, not for medical advice.</p>
        <p class = "small">Email: haspatalnama@gmail.com</p>
    </div>
</footer>

<script src="https://maps.googleapis.com/maps/api/js?key={{ maps_key }}&v=weekly&libraries=marker,places"></script> 

<script>
// --- STATE VARIABLES ---
let map, userMarker, radiusCircle, infoWindow;
let distanceMatrixService;
let hospitalData = [];
let mapMarkers = [];
let mapInitialized = false;
let selectedForCompare = JSON.parse(localStorage.getItem('compareList')) || [];

// Default to central Lahore if no parameters are provided
let userLocation = { lat: 31.5204, lng: 74.3587 }; 
const lahoreBounds = { north: 31.65, south: 31.25, west: 74.05, east: 74.55 };


// Function to add/remove a hospital from the compare list
window.toggleCompare = function(id) {
    // Find if it's already selected
    const existingIndex = selectedForCompare.findIndex(h => h.id == id);
    
    if (existingIndex > -1) {
        // Remove it
        selectedForCompare.splice(existingIndex, 1);
    } else {
        // Add it (limit to 3)
        if (selectedForCompare.length >= 3) {
            alert("You can only select up to 3 hospitals to compare.");
            return;
        }
        const hosp = hospitalData.find(h => h.id == id);
        if (hosp) selectedForCompare.push(hosp);
    }
    
    // Save to local storage
    localStorage.setItem('compareList', JSON.stringify(selectedForCompare));
    
    // Update the UI
    updateCompareUI();
    filterAndRenderData(); // Re-renders the map list to update button states
};

// Function to update the sidebar compare tracker
function updateCompareUI() {
    const listContainer = document.getElementById('selected-compare-list');
    const goBtn = document.getElementById('btn-go-compare');
    
    if (!listContainer || !goBtn) return;
    
    listContainer.innerHTML = '';
    
    if (selectedForCompare.length === 0) {
        goBtn.classList.add('d-none');
    } else {
        selectedForCompare.forEach(h => {
            listContainer.innerHTML += `
                <div class="d-flex justify-content-between align-items-center bg-light border border-dark p-2" style="border-radius: 3px;">
                    <span class="small fw-bold text-truncate" style="max-width: 80%;">${h["Hospital Name"]}</span>
                    <button class="btn btn-sm btn-danger py-0 px-2 border border-dark" onclick="toggleCompare('${h.id}')">&times;</button>
                </div>
            `;
        });
        
        // Show button only if 2 or 3 are selected
        if (selectedForCompare.length >= 2) {
            goBtn.classList.remove('d-none');
            goBtn.innerText = `Compare (${selectedForCompare.length})`;
        } else {
            goBtn.classList.add('d-none');
        }
    }
}
    
// --- READ INCOMING URL PARAMETERS ---
const urlParams = new URLSearchParams(window.location.search);
const latParam = parseFloat(urlParams.get('lat'));
const lngParam = parseFloat(urlParams.get('lng'));
const searchParam = urlParams.get('search');

if (!isNaN(latParam) && !isNaN(lngParam)) {
    userLocation = { lat: latParam, lng: lngParam };
}

// --- INITIALIZATION ON LOAD ---
document.addEventListener("DOMContentLoaded", () => {
    // Fill the sidebar search input with the text typed on the homepage, if available
    if (searchParam) {
        document.getElementById('sidebar-location-search').value = searchParam;
    }

    // Load hospital data from your backend API
    fetch('/api/hospitals')
        .then(res => res.json())
        .then(data => {
            hospitalData = data;
            localStorage.setItem('hospitalDataset', JSON.stringify(data));
            
            // Set up UI components now that data is loaded
            initGoogleMap();
            filterAndRenderData();
        }).catch(err => {
            console.error("Error loading /api/hospitals:", err);
            initGoogleMap(); // Fallback map render even if API fails
        });

    // Listen for radius changes
    document.getElementById('radius-slider').addEventListener('input', (e) => {
        document.getElementById('radius-val').innerText = e.target.value + " km";
        filterAndRenderData();
    });

    // Recommendations placeholder hook
    document.getElementById('btn-get-recs').addEventListener('click', () => {
        alert("Recommendation logic coming soon!");
    });
});

// --- GOOGLE MAPS SETUP ---
function initGoogleMap() {
    if (mapInitialized) return;

    const poiHideStyles = [
        { featureType: 'poi', stylers: [{ visibility: 'off' }] },
        { featureType: 'poi.business', stylers: [{ visibility: 'off' }] },
        { featureType: 'poi.medical', stylers: [{ visibility: 'off' }] },
        { featureType: 'transit', elementType: 'labels.icon', stylers: [{ visibility: 'off' }] }
    ];

    map = new google.maps.Map(document.getElementById('map'), {
        center: userLocation,
        zoom: 12,
        minZoom: 10,
        restriction: { latLngBounds: lahoreBounds, strictBounds: true },
        mapId: "fab6f0d541a614e815fd4bcf",
        clickableIcons: false,
        renderingType: 'RASTER', 
        styles: poiHideStyles 
    });

    infoWindow = new google.maps.InfoWindow();
    distanceMatrixService = new google.maps.DistanceMatrixService();

    const userPin = new google.maps.marker.PinElement({ background: '#000', borderColor: '#fff', glyphColor: '#fff' });
    userMarker = new google.maps.marker.AdvancedMarkerElement({
        map: map, position: userLocation, content: userPin.element, title: "Your Location"
    });

    const initialRadiusMeters = parseInt(document.getElementById('radius-slider').value) * 1000;
    radiusCircle = new google.maps.Circle({
        map: map, center: userLocation, radius: initialRadiusMeters,
        strokeColor: '#000000', strokeOpacity: 0.8, strokeWeight: 2,
        fillColor: '#000000', fillOpacity: 0.05
    });

    // Set up autocomplete on the sidebar input field for subsequent searches
    setupSidebarAutocomplete(document.getElementById('sidebar-location-search'));
    
    mapInitialized = true;
}

function setupSidebarAutocomplete(inputEl) {
    if (!inputEl) return;
    const ac = new google.maps.places.Autocomplete(inputEl, {
        bounds: lahoreBounds, strictBounds: true, fields: ['geometry', 'name']
    });

    ac.addListener('place_changed', () => {
        const place = ac.getPlace();
        if (!place || !place.geometry || !place.geometry.location) return;

        userLocation = { lat: place.geometry.location.lat(), lng: place.geometry.location.lng() };
        
        updateSpatialLayers();
        filterAndRenderData();
    });
}

function updateSpatialLayers() {
    if (!mapInitialized) return;
    const radiusMeters = parseInt(document.getElementById('radius-slider').value) * 1000;
    userMarker.position = userLocation;
    radiusCircle.setCenter(userLocation);
    radiusCircle.setRadius(radiusMeters);
    map.setCenter(userLocation);
}

function filterAndRenderData() {
    if (!mapInitialized) return;
    const targetRadiusKm = parseFloat(document.getElementById('radius-slider').value);
    updateSpatialLayers();

    // Clear old map markers
    mapMarkers.forEach(m => m.map = null);
    mapMarkers = [];

    let preFilteredHospitals = [];
    let destinations = [];

    hospitalData.forEach(hosp => {
        let lat = NaN, lng = NaN;
        if (hosp.Coordinates && typeof hosp.Coordinates === 'string') {
            const parts = hosp.Coordinates.split(',');
            if (parts.length === 2) { lat = parseFloat(parts[0].trim()); lng = parseFloat(parts[1].trim()); }
        }
        if (isNaN(lat) || isNaN(lng)) return;
        hosp.latitude = lat; hosp.longitude = lng;

        const roughDistance = roughBirdDistance(userLocation, { lat, lng });
        if (roughDistance <= targetRadiusKm) {
            preFilteredHospitals.push(hosp);
            destinations.push(new google.maps.LatLng(lat, lng));
        }
    });
    
    if (destinations.length === 0) { renderUIList([]); return; }

    // Distance Matrix limits to maximum of 25 targets per request
    const batchDestinations = destinations.slice(0, 25);
    const batchHospitals = preFilteredHospitals.slice(0, 25);

    distanceMatrixService.getDistanceMatrix({
        origins: [userLocation],
        destinations: batchDestinations,
        travelMode: google.maps.TravelMode.DRIVING,
        drivingOptions: { departureTime: new Date(), trafficModel: google.maps.TrafficModel.BEST_GUESS }
    }, (response, status) => {
        if (status !== google.maps.DistanceMatrixStatus.OK) return;

        const results = response.rows[0].elements;
        let finalRenderList = [];

        batchHospitals.forEach((hosp, index) => {
            const element = results[index];
            if (element.status === "OK") {
                hosp.roadDistanceText = element.distance.text;
                hosp.roadDistanceValueKm = roadDistKm;
            hosp.durationText = element.duration_in_traffic ? element.duration_in_traffic.text : element.duration.text;
            hosp.durationSeconds = element.duration_in_traffic ? element.duration_in_traffic.value : element.duration.value;
            finalRenderList.push(hosp);

            // Dynamically color pins based on travel duration
            let pinColor = "#2a9d8f"; 
            const minutes = hosp.durationSeconds / 60;
            if (minutes > 7 && minutes <= 15) pinColor = "#e9c46a"; 
            if (minutes > 15) pinColor = "#e63946"; 

            const hospitalPin = new google.maps.marker.PinElement({
                background: pinColor, borderColor: "#ffffff", glyphColor: "#ffffff"
            });

            const marker = new google.maps.marker.AdvancedMarkerElement({
                map: map, position: { lat: parseFloat(hosp.latitude), lng: parseFloat(hosp.longitude) },
                content: hospitalPin.element, title: hosp["Hospital Name"]
            });

            marker.addListener('click', () => {
                // Check the selection state right when clicked
                const isSelected = selectedForCompare.some(sh => sh.id == hosp.id);
                const btnText = isSelected ? "Selected" : "Select to compare";
                const btnStyles = isSelected ? "background-color: #000; color: #fff;" : "";

                infoWindow.setContent(`
                    <div style="color: black; padding: 5px; font-family: 'Noto Sans';">
                        <h6 style="margin:0 0 5px 0; font-weight:bold;">${hosp["Hospital Name"]}</h6>
                        <p style="margin:0 0 8px 0; font-size:0.85rem;">
                            Road Distance: <b>${hosp.roadDistanceText}</b><br>
                            Live Drive: <b>${hosp.durationText}</b>
                        </p>
                        <div class="d-flex gap-2">
                            <a href="/hospital/${hosp.id}" class="btn brutal-btn btn-sm w-50" style="font-size: 0.8rem;">View</a>
                            <button onclick="toggleCompare('${hosp.id}')" class="btn brutal-btn btn-sm w-50" style="font-size: 0.8rem; ${btnStyles}">${btnText}</button>
                        </div>
                    </div>
                `);
                infoWindow.open(map, marker);
            });

            mapMarkers.push(marker);
            }
        });
        finalRenderList.sort((a, b) => a.roadDistanceValueKm - b.roadDistanceValueKm);
        renderUIList(finalRenderList);
    });
}

function renderUIList(list) {
    const container = document.getElementById('ranking-list');
    if (!container) return;
    container.innerHTML = list.length === 0 ? '<div class="text-muted p-3">No hospitals found within this scope.</div>' : '';
    
    list.forEach((h) => {
        const isSelected = selectedForCompare.some(sh => sh.id == h.id);
        const btnText = isSelected ? "Selected" : "Select";
        const btnClass = isSelected ? "bg-dark text-white" : "bg-white text-dark";

        container.innerHTML += `
            <div class="list-group-item d-flex flex-column bg-white border border-dark mb-2 p-3" style="border-radius:10px;">
                <div class="d-flex justify-content-between align-items-center w-100">
                    <div>
                        <h6 class="mb-0 fw-bold small"><a href="/hospital/${h.id}" class="text-decoration-none text-dark">${h["Hospital Name"]}</a></h6>
                        <small class="text-muted" style="font-size:0.75rem;">${h["Sector"]} | <span class="fw-bold text-dark">${h.durationText}</span></small>
                    </div>
                    <span class="badge bg-dark rounded-0 text-white small">${h.roadDistanceText}</span>
                </div>
                <button onclick="toggleCompare('${h.id}')" class="btn brutal-btn btn-sm mt-2 w-100 ${btnClass}" style="font-size: 0.8rem;">
                    ${btnText}
                </button>
            </div>`;
    });
}
function roughBirdDistance(pt1, pt2) {
    const R = 6371;
    const dLat = (pt2.lat - pt1.lat) * Math.PI / 180;
    const dLon = (pt2.lng - pt1.lng) * Math.PI / 180;
    const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(pt1.lat * Math.PI / 180) * Math.cos(pt2.lat * Math.PI / 180) * Math.sin(dLon/2) * Math.sin(dLon/2);
    return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
}

</script>

</body>
</html>
